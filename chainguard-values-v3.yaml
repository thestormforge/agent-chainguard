# Chainguard image overrides for the `stormforge` Helm chart, 3.4 and later.
# (For older 3.x charts see chainguard-values-v3.1-3.3.yaml and
# chainguard-values-v3.0.yaml: the component keys differ, and the chart's schema
# rejects keys it doesn't know.)
#
# One workload-agent image backs the cluster agent, applier and webhook, so all
# three point at it. The node-agent (only deployed with nodeAgent.enabled=true)
# is a separate image.
#
# Add this on top of your usual stormforge install values:
#
#   helm install ... -f my-values.yaml -f chainguard-values-v3.yaml
#
# Only the repository is overridden. The packaged chart pins the image tag to
# the release it was tested with, and the Chainguard images are published
# tag-for-tag with upstream, so the correct version resolves automatically.
clusterAgent:
  image:
    repository: ghcr.io/thestormforge/agent-chainguard/workload-agent

applier:
  image:
    repository: ghcr.io/thestormforge/agent-chainguard/workload-agent

webhook:
  image:
    repository: ghcr.io/thestormforge/agent-chainguard/workload-agent

nodeAgent:
  image:
    repository: ghcr.io/thestormforge/agent-chainguard/stormforge-node-agent

# Third-party Prometheus (the forwarder) is NOT overridden here.
#
# If you standardise on Chainguard, point the forwarder at your own Chainguard
# Prometheus via forwarder.image.repository / forwarder.image.tag. Three things
# to note:
#   - match the Prometheus version to the chart's default forwarder.image.tag
#   - use a SHELLED Prometheus variant: the forwarder's init container runs
#     /bin/sh + sed (using the Prometheus image) to template its config, so a
#     distroless/shell-less image fails to start with "sh: not found".
#   - set WORKDIR /prometheus on the image, or Prometheus fails with
#     "mkdir /data-agent: permission denied" (the chart relies on the default
#     relative storage path resolving under /prometheus). Wrap the Chainguard
#     image with a two-line Dockerfile that adds `WORKDIR /prometheus`.
