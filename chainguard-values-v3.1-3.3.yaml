# Chainguard image overrides for the `stormforge` Helm chart, 3.1 through 3.3.
# Same as chainguard-values-v3.yaml (3.4+), except the webhook's key is
# `webhookService` (renamed to `webhook` in 3.4). See that file for the
# Prometheus forwarder notes.
#
#   helm install ... -f my-values.yaml -f chainguard-values-v3.1-3.3.yaml
clusterAgent:
  image:
    repository: ghcr.io/thestormforge/agent-chainguard/workload-agent

applier:
  image:
    repository: ghcr.io/thestormforge/agent-chainguard/workload-agent

webhookService:
  image:
    repository: ghcr.io/thestormforge/agent-chainguard/workload-agent

nodeAgent:
  image:
    repository: ghcr.io/thestormforge/agent-chainguard/stormforge-node-agent
